<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Matrix Led Yılan</title>
<style>
  :root { --bg:#111; --btn:#232323; --line:#3a3a3a; --tx:#eee; --acc:#2bbf5c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--tx); font:16px system-ui, sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:16px; user-select:none; }
  h1 { font-size:20px; margin:8px 0 4px; }
  #durum { color:#999; min-height:1.4em; margin-bottom:14px; }
  .pad { display:grid; grid-template-columns:repeat(3, 92px); grid-template-rows:repeat(3, 92px); gap:10px; }
  .pad button { font-size:34px; border-radius:18px; border:1px solid var(--line); background:var(--btn); color:var(--tx); touch-action:manipulation; }
  .pad button:active { background:#2f2f2f; }
  .alt { display:flex; gap:12px; margin-top:22px; }
  .alt button { font-size:17px; padding:12px 22px; border-radius:12px; border:1px solid var(--line); background:var(--btn); color:var(--tx); }
  .alt .basla { background:var(--acc); border-color:var(--acc); color:#03140a; font-weight:700; }
  .k { color:#777; font-size:13px; margin-top:18px; text-align:center; }
</style>
</head>
<body>
  <h1>🐍 Matrix Led Yılan</h1>
  <div id="durum">Başlat'a bas, sonra yön tuşlarıyla oyna.</div>
  <div class="pad">
    <span></span><button data-yon="u">▲</button><span></span>
    <button data-yon="l">◀</button><span></span><button data-yon="r">▶</button>
    <span></span><button data-yon="d">▼</button><span></span>
  </div>
  <div class="alt">
    <button class="basla" id="basla">Başlat</button>
    <button id="bitir">Bitir</button>
  </div>
  <div class="k">Klavyede ok tuşları da çalışır. Kenarlardan öbür tarafa geçersin; kendine çarpınca oyun biter.<br>90 sn dokunmazsan oyun kendiliğinden kapanır.</div>
<script>
const post = (yol, b = {}) => fetch(yol, { method: 'POST', body: JSON.stringify(b) }).then(r => r.json()).catch(() => ({}));
const durum = t => document.getElementById('durum').textContent = t;
document.getElementById('basla').onclick = async () => { const r = await post('/oyun/basla', { parlaklik: 0.4 }); durum(r.sahne || 'hata'); };
document.getElementById('bitir').onclick = async () => { await post('/oyun/bitir'); durum('oyun bitti'); };
const yon = y => post('/oyun/yon', { yon: y }).then(r => { if (r.sonuc === 'oyun yok') durum('Oyun açık değil — Başlat\'a bas'); });
document.querySelectorAll('[data-yon]').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); yon(b.dataset.yon); }));
const tus = { ArrowUp: 'u', ArrowDown: 'd', ArrowLeft: 'l', ArrowRight: 'r', w: 'u', s: 'd', a: 'l', d: 'r' };
document.addEventListener('keydown', e => { if (tus[e.key]) { e.preventDefault(); yon(tus[e.key]); } });
</script>
</body>
</html>
