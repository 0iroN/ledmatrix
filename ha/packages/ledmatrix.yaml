# Matrix Led (16x32 WS2812B, yatay 32x16) — Pi'deki ledmatrix servisini sürer.
# Servis: http://ledmatrix.local:8790  (kaynak: Desktop/ssh/ledmatrix/server.py)
# Resim yükleme sayfası: http://ledmatrix.local:8790/

rest_command:
  ledmatrix_goster:
    url: http://ledmatrix.local:8790/goster
    method: POST
    content_type: application/json
    payload: >-
      {"dosya": {{ dosya | to_json }},
       "parlaklik": {{ states('input_number.ledmatrix_parlaklik') | float(30) / 100 }}}
  ledmatrix_yazi:
    url: http://ledmatrix.local:8790/yazi
    method: POST
    content_type: application/json
    payload: >-
      {"metin": {{ metin | to_json }}, "renk": {{ renk | to_json }},
       "parlaklik": {{ states('input_number.ledmatrix_parlaklik') | float(30) / 100 }}}
  ledmatrix_renk:
    url: http://ledmatrix.local:8790/renk
    method: POST
    content_type: application/json
    payload: >-
      {"renk": {{ renk | to_json }},
       "parlaklik": {{ states('input_number.ledmatrix_parlaklik') | float(30) / 100 }}}
  ledmatrix_dur:
    url: http://ledmatrix.local:8790/dur
    method: POST
  ledmatrix_yazici:
    url: http://ledmatrix.local:8790/sahne/yazici
    method: POST
    content_type: application/json
    payload: >-
      {"durum": {{ states('sensor.a1_03919d572410453_print_status') | to_json }},
       "yuzde": {{ states('sensor.a1_03919d572410453_print_progress') | float(0) }},
       "kalan_saat": {{ states('sensor.a1_03919d572410453_remaining_time') | float(0) }},
       "parlaklik": {{ states('input_number.ledmatrix_parlaklik') | float(30) / 100 }}}
  ledmatrix_yazici_bitir:            # yazıcı ekranı kapatılınca sahneden çık (eski içerik döner)
    url: http://ledmatrix.local:8790/sahne/yazici
    method: POST
    content_type: application/json
    payload: '{"durum": "idle"}'
  ledmatrix_dongu:
    url: http://ledmatrix.local:8790/sahne/dongu
    method: POST
    content_type: application/json
    payload: >-
      {"acik": {{ is_state('input_boolean.ledmatrix_dongu', 'on') | to_json }},
       "sayfalar": {
       {%- for ad in ['saat', 'hava', 'pm25', 'takvim', 'saglik', 'minecraft', 'gif'] -%}
         {%- set v = states('input_select.ledmatrix_sayfa_' ~ ad) -%}
         "{{ ad }}": {{ 0 if v in ('kapalı', 'unknown', 'unavailable') else v.split(' ')[0] | int(0) }}{{ ',' if not loop.last }}
       {%- endfor -%} },
       "parlaklik": {{ states('input_number.ledmatrix_parlaklik') | float(30) / 100 }}}
  ledmatrix_bilgi:
    url: http://ledmatrix.local:8790/bilgi
    method: POST
    content_type: application/json
    payload: >-
      {"hava": {{ states('weather.forecast_home') | to_json }},
       "sicaklik": {{ state_attr('weather.forecast_home', 'temperature') | to_json }},
       "pm25": {{ states('sensor.living_room_pm2_5') | to_json }}}
  ledmatrix_pomodoro:
    url: http://ledmatrix.local:8790/sahne/pomodoro
    method: POST
    content_type: application/json
    payload: >-
      {"dakika": {{ dakika | default(25) | float(25) }}, "mola": {{ mola | default(5) | float(5) }},
       "parlaklik": {{ states('input_number.ledmatrix_parlaklik') | float(30) / 100 }}}
  ledmatrix_mesaj:
    url: http://ledmatrix.local:8790/sahne/mesaj
    method: POST
    content_type: application/json
    payload: >-
      {"metin": {{ metin | to_json }}, "tekrar": {{ tekrar | default(3) | int(3) }},
       "parlaklik": {{ states('input_number.ledmatrix_parlaklik') | float(30) / 100 }}}
  ledmatrix_gundogumu:
    url: http://ledmatrix.local:8790/sahne/gundogumu
    method: POST
    content_type: application/json
    payload: >-
      {"dakika": {{ dakika | default(20) | float(20) }},
       "parlaklik": {{ states('input_number.ledmatrix_parlaklik') | float(30) / 100 }}}
  ledmatrix_parlaklik:
    url: http://ledmatrix.local:8790/parlaklik
    method: POST
    content_type: application/json
    payload: >-
      {"parlaklik": {{ states('input_number.ledmatrix_parlaklik') | float(30) / 100 }}}
  ledmatrix_dongu_gif:               # bir GIF'i bilgi döngüsünün rastgele GIF havuzuna al / çıkar
    url: http://ledmatrix.local:8790/dongu/gifler
    method: POST
    content_type: application/json
    payload: '{"dosya": {{ dosya | to_json }}, "dongude": {{ dongude | to_json }}}'
  ledmatrix_dongu_gif_hepsi:         # hepsi true = hepsini al, false = hepsini çıkar
    url: http://ledmatrix.local:8790/dongu/gifler
    method: POST
    content_type: application/json
    payload: '{"hepsi": {{ hepsi | to_json }}}'

rest:
  - resource: http://ledmatrix.local:8790/liste
    scan_interval: 60
    sensor:
      - name: Matrix Led Dosyalar
        unique_id: ledmatrix_dosyalar
        icon: mdi:folder-image
        value_template: "{{ value_json.dosyalar | count }}"
        json_attributes:
          - dosyalar
  - resource: http://ledmatrix.local:8790/durum
    scan_interval: 10
    sensor:
      - name: Matrix Led Gösterilen
        unique_id: ledmatrix_gosterilen
        icon: mdi:led-strip-variant
        value_template: "{{ value_json.gosterilen }}"
  # Bilgi döngüsünün GIF havuzu: durum "döngüdeki / toplam", liste özniteliği seçme kutusunu doldurur.
  - resource: http://ledmatrix.local:8790/dongu/gifler
    scan_interval: 60
    sensor:
      - name: Matrix Led Döngü GIF
        unique_id: ledmatrix_dongu_gifleri
        icon: mdi:file-gif-box
        value_template: >-
          {{ value_json.gifler | selectattr('dongude') | list | count }} / {{ value_json.gifler | count }}
        json_attributes:
          - gifler

